name: compilar iso debian lite
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: instalar dependencias de compilacion 
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap live-boot
          
      - name: Limpoiar entorno anterior
        run: |
          sudo lb clean --purge

      - name: descargar e integrar peazip
        run: |
          mkdir -p config/packages.chroot
          wget --nno-check-certificate https://github.com/peazip/PeaZip/releases/download/11.3.0/peazip_11.3.0.LINUX.GTK2-1_amd64.deb -O config/packages.chroot/peazip.deb || true

      - name: configurar y generar la imagen iso
        run: |
          sudo lb config \
            --architectures amd64 \
            --distribution trixie \
            --binary-images iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --keyring-packages debian-archive-keyring \
            --mode debian \
            --apt-indices none \
            --security false \
            --mirror-bootstrap "http://debian.org" \
            --mirror-chroot "http://debian.org" \
            --mirror-binary "http://debian.org"

      - name: Compilar la ISO (Build)
        run: |
          sudo lb build
      - name: Subir ISO como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: mat-os-lite-amd64.iso
          path: "*.iso"
          if-no-files-found: error
